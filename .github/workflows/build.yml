name: Build APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Extract zip and fix Gradle
        run: |
          find . -name "*.zip" -exec unzip -o {} \;
          PROJ_DIR=$(find . -maxdepth 3 -type f -name "build.gradle*" -exec dirname {} \; | head -n 1)
          if [ -z "$PROJ_DIR" ]; then
            echo "No build.gradle found!"
            exit 1
          fi
          cd "$PROJ_DIR"

          # Fix repositories directly inside root build.gradle
          ROOT_BUILD=$(find . -maxdepth 2 -name "build.gradle*" | head -n 1)
          if [ -f "$ROOT_BUILD" ]; then
            sed -i '1s/^/buildscript { repositories { google(); mavenCentral() } }\nallprojects { repositories { google(); mavenCentral() } }\n/' "$ROOT_BUILD"
          fi

          gradle wrapper --gradle-version 8.0
          chmod +x gradlew
          echo "PROJECT_DIR=$PROJ_DIR" >> $GITHUB_ENV

      - name: Build APK
        run: |
          cd ${{ env.PROJECT_DIR }}
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: |
            */build/outputs/apk/debug/.apk
