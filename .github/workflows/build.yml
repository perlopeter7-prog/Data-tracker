name: Build APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Extract zip and setup Gradle wrapper
        run: |
          find . -name "*.zip" -exec unzip -o {} \;
          PROJ_DIR=$(find . -maxdepth 3 -type f -name "build.gradle*" -exec dirname {} \; | head -n 1)
          if [ -z "$PROJ_DIR" ]; then
            echo "No build.gradle found!"
            exit 1
          fi
          cd "$PROJ_DIR"
          gradle wrapper
          chmod +x gradlew
          echo "PROJECT_DIR=$PROJ_DIR" >> $GITHUB_ENV

      - name: Build APK
        run: |
          cd ${{ env.PROJECT_DIR }}
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: |
            */build/outputs/apk/debug/.apk
