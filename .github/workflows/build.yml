name: Build APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Extract zip and setup Gradle wrapper
        run: |
          find . -name "*.zip" -exec unzip -o {} \;
          PROJ_DIR=$(find . -maxdepth 3 -type f -name "build.gradle*" -exec dirname {} \; | head -n 1)
          if [ -z "$PROJ_DIR" ]; then
            echo "No build.gradle found!"
            exit 1
          fi
          cd "$PROJ_DIR"
          
          # Setup Gradle Wrapper v8.0 to support Android Plugin 8.1.0
          gradle wrapper --gradle-version 8.0
          
          # Inject repositories if settings.gradle doesn't have them
          if [ -f "settings.gradle" ]; then
            echo -e "\npluginManagement {\n  repositories {\n    google()\n    mavenCentral()\n    gradlePluginPortal()\n  }\n}" >> settings.gradle
          elif [ -f "settings.gradle.kts" ]; then
            echo -e "\npluginManagement {\n  repositories {\n    google()\n    mavenCentral()\n    gradlePluginPortal()\n  }\n}" >> settings.gradle.kts
          fi

          chmod +x gradlew
          echo "PROJECT_DIR=$PROJ_DIR" >> $GITHUB_ENV

      - name: Build APK
        run: |
          cd ${{ env.PROJECT_DIR }}
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: |
            */build/outputs/apk/debug/.apk
